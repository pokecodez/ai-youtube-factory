name: AI YouTube Factory - Narration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-narration:
    runs-on: ubuntu-latest
    steps:
      - name: Generate narration audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          python -m pip install --quiet requests

          python - <<'PY'
          import os
          import requests
          import base64
          import json

          url = "https://generativelanguage.googleapis.com/v1beta/interactions"

          payload = {
              "model": "gemini-3.8-flash-tts",
              "input": [
                  {
                      "type": "user_input",
                      "content": [
                          {
                              "type": "text",
                              "text": "Welcome to the mystery files. Tonight, we explore a strange historical mystery. The evidence tells part of the story, but some questions remain unanswered.",
                              "annotations": [
                                  {
                                      "type": "speech_metadata",
                                      "style": "Calm, cinematic British English narration. Clear pronunciation, measured pace, intriguing documentary tone."
                                  }
                              ]
                          }
                      ]
                  }
              ],
              "response_format": {
                  "type": "audio",
                  "mime_type": "audio/wav"
              },
              "generation_config": {
                  "speech_config": [
                      {
                          "voice": "Kore"
                      }
                  ]
              }
          }

          response = requests.post(
              url,
              headers={
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
                  "Content-Type": "application/json"
              },
              json=payload,
              timeout=120
          )

          if not response.ok:
              print("TTS API returned an error:")
              print(response.text[:3000])
              response.raise_for_status()

          data = response.json()
          audio = data.get("output_audio", {}).get("data")

          if not audio:
              print(json.dumps(data, indent=2)[:3000])
              raise SystemExit("No audio data was returned.")

          audio_bytes = base64.b64decode(audio)

          if not audio_bytes.startswith(b"RIFF"):
              raise SystemExit("The returned audio was not a WAV file.")

          with open("narration.wav", "wb") as f:
              f.write(audio_bytes)

          print("SUCCESS: Narration generated.")
          print(f"Audio size: {len(audio_bytes)} bytes")
          print("File: narration.wav")
          PY
