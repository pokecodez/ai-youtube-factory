name: AI YouTube Factory - Image Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-image:
    runs-on: ubuntu-latest
    steps:
      - name: Generate mystery documentary image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          python -m pip install --quiet requests

          python - <<'PY'
          import os
          import requests
          import base64
          import json

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent"

          payload = {
              "contents": [{
                  "parts": [{
                      "text": "Create an original cinematic 16:9 YouTube documentary visual about an abandoned historical stone building at night, surrounded by mist, with a small warm light visible in one window. Atmospheric, realistic photography, detailed stone textures, dramatic moonlight, mysterious but not horror-gory. No text, no lettering, no logos."
                  }]
              }],
              "generationConfig": {
                  "responseModalities": ["IMAGE"]
              }
          }

          response = requests.post(
              url,
              headers={
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
                  "Content-Type": "application/json"
              },
              json=payload,
              timeout=180
          )

          if not response.ok:
              print("Image API returned an error:")
              print(response.text[:3000])
              response.raise_for_status()

          data = response.json()
          image_data = None
          mime_type = "image/png"

          for candidate in data.get("candidates", []):
              for part in candidate.get("content", {}).get("parts", []):
                  inline = part.get("inlineData") or part.get("inline_data")
                  if inline and inline.get("data"):
                      image_data = inline["data"]
                      mime_type = inline.get("mimeType", inline.get("mime_type", mime_type))
                      break
              if image_data:
                  break

          if not image_data:
              print(json.dumps(data, indent=2)[:3000])
              raise SystemExit("The API returned no image data.")

          image_bytes = base64.b64decode(image_data)

          if not image_bytes.startswith(b"\x89PNG\r\n\x1a\n"):
              if mime_type == "image/jpeg" and image_bytes.startswith(b"\xff\xd8"):
                  filename = "generated-image.jpg"
              else:
                  raise SystemExit(f"Unexpected image format: {mime_type}")
          else:
              filename = "generated-image.png"

          with open(filename, "wb") as f:
              f.write(image_bytes)

          print("SUCCESS: Image generated.")
          print(f"File: {filename}")
          print(f"Size: {len(image_bytes)} bytes")
          PY

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: generated-image.*
          if-no-files-found: error
          retention-days: 7
