name: AI YouTube Factory - Image Search Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-images:
    runs-on: ubuntu-latest
    steps:
      - name: Search Openverse for mystery visuals
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              "q": "abandoned castle fog",
              "page_size": 5,
              "license_type": "commercial"
          })

          url = "https://api.openverse.org/v1/images/?" + query
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "AIYouTubeFactory/1.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
          except Exception as error:
              raise SystemExit(f"Image search failed: {error}")

          results = data.get("results", [])

          if not results:
              raise SystemExit("No images found. Try a different search.")

          for index, item in enumerate(results, start=1):
              print(f"\nIMAGE {index}")
              print("Title:", item.get("title", "Untitled"))
              print("Creator:", item.get("creator", "Unknown"))
              print("Licence:", item.get("license", "Unknown"))
              print("Image URL:", item.get("url", "Unavailable"))
              print("Attribution:", item.get("attribution", "Unavailable"))

          print(f"\nSUCCESS: Found {len(results)} images.")
          PY
