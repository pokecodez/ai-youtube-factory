name: Gemini API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body --max-time 60 \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -o models.json

          python -c '
          import json

          with open("models.json", encoding="utf-8") as f:
              data = json.load(f)

          models = data.get("models", [])
          usable = [
              model["name"]
              for model in models
              if "generateContent" in model.get("supportedGenerationMethods", [])
          ]

          if not usable:
              print("No models supporting text generation were returned.")
              raise SystemExit(1)

          print("Models available for text generation:")
          for name in usable:
              print(name)
          '
