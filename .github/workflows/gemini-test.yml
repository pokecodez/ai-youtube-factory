name: AI YouTube Factory - Generate Script

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  generate-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate original script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body --max-time 90 \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Create an original 60-second YouTube mystery documentary script about a real historical mystery. Include a compelling title, narration of around 130-150 words, and three visual suggestions. Separate verified facts from speculation. Do not invent evidence, copy existing videos, or use misleading claims."
                }]
              }],
              "generationConfig": {
                "temperature": 0.8,
                "maxOutputTokens": 1200
              }
            }'

          python -c '
          import json
          from pathlib import Path

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          candidates = data.get("candidates", [])
          if not candidates:
              raise SystemExit("Gemini returned no script.")

          parts = candidates[0].get("content", {}).get("parts", [])
          script = "\n".join(
              part.get("text", "")
              for part in parts
              if "text" in part
          )

          if not script.strip():
              raise SystemExit("The generated script was empty.")

          Path("generated-script.txt").write_text(script, encoding="utf-8")
          '

      - name: Save script to repository
        run: |
          set -euo pipefail

          mkdir -p scripts
          filename="scripts/script-$(date -u +%Y%m%d-%H%M%S).txt"
          mv generated-script.txt "$filename"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$filename"
          git commit -m "Generate original video script"
          git push

          echo "Saved script to $filename"
