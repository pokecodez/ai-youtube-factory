
      - name: Assemble MP4 reliably (small scene clips, not a giant filter graph)
        run: |
          set -euo pipefail

          python - <<'PY_RENDER'
          import json
          import subprocess
          from pathlib import Path

          out = Path("output")
          scenes = json.loads((out / "scene-timings.json").read_text(encoding="utf-8"))
          duration = float((out / "duration.txt").read_text(encoding="utf-8").strip())
          frames_per_second = 24
          clips = out / "render-parts"
          clips.mkdir(parents=True, exist_ok=True)
          render_log = out / "render-log.txt"
          render_log.write_text("Reliable per-scene rendering log\n", encoding="utf-8")

          def run_ffmpeg(args, label):
              # Capture useful error output, not just an enormous command traceback.
              process = subprocess.run(
                  args, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  text=True, errors="replace", check=False
              )
              with render_log.open("a", encoding="utf-8") as log:
                  log.write(f"\n[{label}] exit={process.returncode}\n")
                  log.write(process.stderr[-14000:] + "\n")
              if process.returncode:
                  excerpt = "\n".join(process.stderr.splitlines()[-35:])
                  raise SystemExit(
                      f"Video render failed at {label} (exit code {process.returncode}). "
                      f"FFmpeg output:\n{excerpt}\nDetailed log: {render_log}"
                  )

          if not scenes:
              raise SystemExit("Cannot render: scene-timings.json has no scenes.")

          # Use cumulative frame boundaries so rounding errors do not build up.
          frame_counts = []
          elapsed = 0.0
          previous_frame = 0
          for scene in scenes:
              elapsed += float(scene["duration"])
              next_frame = round(elapsed * frames_per_second)
              frame_counts.append(max(1, next_frame - previous_frame))
              previous_frame = next_frame

          concat_file = out / "scene-clips.ffconcat"
          concat_lines = ["ffconcat version 1.0"]
          for index, (scene, number_of_frames) in enumerate(zip(scenes, frame_counts), start=1):
              image_path = out / "images" / scene["file"]
              if not image_path.is_file() or image_path.stat().st_size < 1000:
                  raise SystemExit(f"Missing or invalid image for scene {index}: {image_path}")
              clip_path = clips / f"scene-{index:03d}.mp4"
              print(f"Rendering scene {index}/{len(scenes)} ({number_of_frames} frames).", flush=True)
              run_ffmpeg([
                  "ffmpeg", "-hide_banner", "-nostdin", "-loglevel", "error", "-y",
                  "-loop", "1", "-framerate", str(frames_per_second),
                  "-i", str(image_path),
                  "-vf", (
                      "scale=1280:720:force_original_aspect_ratio=increase,"
                      "crop=1280:720,setsar=1,format=yuv420p,"
                      "drawbox=x=0:y=0:w=iw:h=66:color=black@0.62:t=fill,"
                      "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                      "text='SIGNAL BRIEF':fontcolor=white:fontsize=28:x=42:y=17"
                  ),
                  "-frames:v", str(number_of_frames),
                  "-an", "-c:v", "libx264", "-preset", "ultrafast", "-crf", "23",
                  "-r", str(frames_per_second), "-pix_fmt", "yuv420p",
                  "-threads", "2", str(clip_path)
              ], f"scene {index}")
              concat_lines.append(f"file 'render-parts/{clip_path.name}'")

          concat_file.write_text("\n".join(concat_lines) + "\n", encoding="utf-8")
          fade_start = max(0.0, duration - 3.0)
          filters = (
              "[0:v]subtitles=output/captions.srt:"
              "force_style='FontName=DejaVu Sans,FontSize=20,Outline=2,Shadow=1,Alignment=2,MarginV=44'[video];"
              "[1:a]aformat=sample_fmts=fltp:channel_layouts=stereo,volume=1.0[narration];"
              f"[2:a]aformat=sample_fmts=fltp:channel_layouts=stereo,volume=0.24,"
              f"afade=t=out:st={fade_start:.3f}:d=3[music];"
              "[narration][music]amix=inputs=2:duration=first:dropout_transition=2[audio]"
          )
          print("Combining scene clips, aligned subtitles, narration and background music.", flush=True)
          run_ffmpeg([
              "ffmpeg", "-hide_banner", "-nostdin", "-loglevel", "error", "-y",
              "-f", "concat", "-safe", "0", "-i", str(concat_file),
              "-i", str(out / "narration.wav"),
              "-i", str(out / "background-music.wav"),
              "-filter_complex", filters,
              "-map", "[video]", "-map", "[audio]",
              "-c:v", "libx264", "-preset", "veryfast", "-crf", "23",
              "-r", str(frames_per_second), "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-b:a", "160k", "-threads", "2",
              "-t", f"{duration:.3f}", "-movflags", "+faststart",
              str(out / "signal-brief.mp4")
          ], "final assembly")
          print("Reliable video rendering completed successfully.")
          PY_RENDER


