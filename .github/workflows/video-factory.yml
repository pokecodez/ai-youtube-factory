name: AI YouTube Factory - Build Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet requests pillow

      - name: Generate script, narration and images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          cat > build.py <<'PY'
          import os
          import json
          import base64
          import requests
          import subprocess
          import urllib.parse
          import urllib.request
          import io
          from pathlib import Path
          from PIL import Image

          key = os.environ["GEMINI_API_KEY"]
          out = Path("output")
          images = out / "images"
          images.mkdir(parents=True, exist_ok=True)

          prompt = """Write an original short documentary narration about a real historical mystery.
          Around 120 words. Use verified facts, distinguish speculation from evidence,
          and avoid fabricated details. Return only the spoken narration."""

          response = requests.post(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
              headers={"x-goog-api-key": key},
              json={
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"temperature": 0.7, "maxOutputTokens": 700}
              },
              timeout=90
          )
          response.raise_for_status()
          data = response.json()
          script = "".join(
              part.get("text", "")
              for part in data["candidates"][0]["content"]["parts"]
          ).strip()

          if not script:
              raise SystemExit("Script generation returned empty text.")

          (out / "script.txt").write_text(script, encoding="utf-8")
          print("Script generated.")

          payload = {
              "model": "gemini-3.8-flash-tts",
              "input": [{
                  "type": "user_input",
                  "content": [{
                      "type": "text",
                      "text": script,
                      "annotations": [{
                          "type": "speech_metadata",
                          "style": "Calm, cinematic British English documentary narration. Clear pronunciation and measured pace."
                      }]
                  }]
              }],
              "response_format": {"type": "audio", "mime_type": "audio/wav"},
              "generation_config": {"speech_config": [{"voice": "Kore"}]}
          }

          response = requests.post(
              "https://generativelanguage.googleapis.com/v1beta/interactions",
              headers={"x-goog-api-key": key, "Content-Type": "application/json"},
              json=payload,
              timeout=180
          )

          if not response.ok:
              print(response.text[:2000])
              response.raise_for_status()

          audio = None
          for step in response.json().get("steps", []):
              for item in step.get("content", []):
                  if item.get("data"):
                      audio = item["data"]
                      break
              if audio:
                  break

          if not audio:
              raise SystemExit("No narration audio returned.")

          audio_bytes = base64.b64decode(audio)
          if not audio_bytes.startswith(b"RIFF"):
              raise SystemExit("Narration was not returned as WAV audio.")

          (out / "narration.wav").write_bytes(audio_bytes)

          params = urllib.parse.urlencode({
              "q": "historical ruins castle archaeology",
              "page_size": 30,
              "license_type": "commercial"
          })

          request = urllib.request.Request(
              "https://api.openverse.org/v1/images/?" + params,
              headers={"User-Agent": "AIYouTubeFactory/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              results = json.load(response).get("results", [])

          attribution = []

          for item in results:
              if len(attribution) >= 5:
                  break

              url = item.get("url", "")
              if not url.startswith("https://"):
                  continue

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "AIYouTubeFactory/1.0"}
                  )

                  with urllib.request.urlopen(request, timeout=30) as response:
                      content_type = response.headers.get("Content-Type", "").split(";")[0]
                      raw = response.read(8 * 1024 * 1024 + 1)

                  if content_type not in ("image/jpeg", "image/png", "image/webp"):
                      continue
                  if len(raw) > 8 * 1024 * 1024:
                      continue

                  im = Image.open(io.BytesIO(raw))
                  if im.width < 800 or im.height < 450:
                      continue

                  filename = f"image-{len(attribution) + 1}.jpg"
                  im.convert("RGB").save(images / filename, quality=90)

                  attribution.append({
                      "file": filename,
                      "title": item.get("title"),
                      "creator": item.get("creator"),
                      "license": item.get("license"),
                      "license_url": item.get("license_url"),
                      "source": item.get("foreign_landing_url"),
                      "attribution": item.get("attribution")
                  })

              except Exception as error:
                  print("Skipping image:", str(error))

          if not attribution:
              raise SystemExit("No suitable downloadable images found.")

          (out / "attribution.json").write_text(
              json.dumps(attribution, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          duration = float(subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(out / "narration.wav")
          ], text=True).strip())

          words = script.split()

          def stamp(seconds):
              milliseconds = int(seconds * 1000)
              hours, milliseconds = divmod(milliseconds, 3600000)
              minutes, milliseconds = divmod(milliseconds, 60000)
              seconds, milliseconds = divmod(milliseconds, 1000)
              return f"{hours:02}:{minutes:02}:{seconds:02},{milliseconds:03}"

          groups = [words[i:i + 8] for i in range(0, len(words), 8)]

          with open(out / "captions.srt", "w", encoding="utf-8") as file:
              for index, group in enumerate(groups):
                  start = duration * index / len(groups)
                  end = duration * (index + 1) / len(groups)
                  file.write(
                      f"{index + 1}\n{stamp(start)} --> {stamp(end)}\n"
                      + " ".join(group) + "\n\n"
                  )

          (out / "duration.txt").write_text(str(duration))
          print(f"Prepared script, narration and {len(attribution)} images.")
          PY

          python build.py

      - name: Assemble MP4 with background music
        run: |
          set -euo pipefail

          duration=$(cat output/duration.txt)
          count=$(find output/images -maxdepth 1 -name 'image-*.jpg' | wc -l)
          music="Assets/Song"

          if [ ! -f "$music" ]; then
            echo "Music file not found: $music"
            echo "Check the exact filename and extension inside the Assets folder."
            find Assets -maxdepth 2 -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p output/frames

          for i in $(seq 1 "$count"); do
            length=$(python -c "print($duration/$count)")

            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 -framerate 24 -i "output/images/image-$i.jpg" \
              -t "$length" \
              -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,zoompan=z='min(zoom+0.0005,1.08)':d=1:s=1920x1080:fps=24,setsar=1" \
              -an -c:v libx264 -pix_fmt yuv420p \
              "output/frames/scene-$i.mp4"
          done

          for f in output/frames/scene-*.mp4; do
            printf "file '%s'\n" "frames/$(basename "$f")"
          done > output/concat.txt

          fade_start=$(python -c "print(max(0,float('$duration')-3))")

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i output/concat.txt \
            -i output/narration.wav \
            -stream_loop -1 -i "$music" \
            -filter_complex \
            "[1:a]volume=1.0[narration];[2:a]volume=0.12,afade=t=out:st=${fade_start}:d=3[music];[narration][music]amix=inputs=2:duration=first:dropout_transition=2[audio]" \
            -vf "subtitles=output/captions.srt:force_style='FontName=Arial,FontSize=22,Outline=2,Shadow=1,Alignment=2,MarginV=55'" \
            -map 0:v:0 -map "[audio]" \
            -c:v libx264 -preset ultrafast -crf 23 \
            -c:a aac -b:a 160k -shortest \
            -movflags +faststart output/mystery-documentary.mp4

      - name: Upload finished video and source files
        uses: actions/upload-artifact@v4
        with:
          name: mystery-documentary-video
          path: output/
          if-no-files-found: error
          retention-days: 7
