name: Signal Brief - Current News Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet requests pillow

      - name: Research current news, write narration and match visuals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          cat > build.py <<'PY'
          import os
          import json
          import base64
          import wave
          import requests
          import subprocess
          import urllib.request
          import io
          import re
          import html
          import random
          import time
          from pathlib import Path
          from PIL import Image

          key = os.environ["GEMINI_API_KEY"]
          out = Path("output")
          images = out / "images"
          images.mkdir(parents=True, exist_ok=True)

          def gemini_post(url, **kwargs):
              kwargs["timeout"] = (20, 300)
              last_error = None
              for attempt in range(4):
                  try:
                      result = requests.post(url, **kwargs)
                      if result.status_code not in (408, 429, 500, 502, 503, 504):
                          return result
                      last_error = RuntimeError(
                          f"Gemini returned HTTP {result.status_code}: {result.text[:500]}"
                      )
                      if attempt == 3:
                          result.raise_for_status()
                          return result
                  except (requests.exceptions.Timeout, requests.exceptions.ConnectionError) as error:
                      last_error = error
                      if attempt == 3:
                          raise RuntimeError(
                              "Gemini API timed out after 4 attempts. "
                              "Wait a few minutes and rerun the workflow."
                          ) from error
                  wait_seconds = 5 * (2 ** attempt)
                  print(f"Gemini request attempt {attempt + 1} failed; retrying in {wait_seconds}s.")
                  time.sleep(wait_seconds)
              raise RuntimeError(f"Gemini request failed: {last_error}")

          feeds = [
              ("BBC World", "https://feeds.bbci.co.uk/news/world/rss.xml"),
              ("BBC UK", "https://feeds.bbci.co.uk/news/uk/rss.xml"),
              ("The Guardian World", "https://www.theguardian.com/world/rss"),
              ("The Guardian Technology", "https://www.theguardian.com/technology/rss"),
              ("NPR World", "https://feeds.npr.org/1004/rss.xml"),
              ("Al Jazeera News", "https://www.aljazeera.com/xml/rss/all.xml"),
          ]
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          now = datetime.now(timezone.utc)
          news_items = []
          for source_name, feed_url in feeds:
              try:
                  feed_response = requests.get(
                      feed_url,
                      headers={"User-Agent": "SignalBrief/1.0 (current affairs research)"},
                      timeout=20
                  )
                  feed_response.raise_for_status()
                  root = ET.fromstring(feed_response.content)
                  entries = root.findall(".//item")
                  if not entries:
                      entries = [node for node in root.iter() if node.tag.endswith("entry")]
                  for entry in entries:
                      def node_text(names):
                          for node in entry.iter():
                              if node.tag.split("}")[-1].lower() in names and node.text:
                                  return node.text.strip()
                          return ""
                      headline = node_text({"title"})
                      summary = node_text({"description", "summary", "encoded"})
                      link = ""
                      for node in entry.iter():
                          if node.tag.split("}")[-1].lower() == "link":
                              link = (node.attrib.get("href") or node.text or "").strip()
                              if link:
                                  break
                      published = node_text({"pubdate", "published", "updated", "date"})
                      try:
                          published_at = parsedate_to_datetime(published)
                          if published_at.tzinfo is None:
                              published_at = published_at.replace(tzinfo=timezone.utc)
                          published_at = published_at.astimezone(timezone.utc)
                      except Exception:
                          try:
                              published_at = datetime.fromisoformat(published.replace("Z", "+00:00"))
                              if published_at.tzinfo is None:
                                  published_at = published_at.replace(tzinfo=timezone.utc)
                              published_at = published_at.astimezone(timezone.utc)
                          except Exception:
                              published_at = now - timedelta(hours=12)
                      summary = re.sub(r"<[^>]+>", " ", summary)
                      summary = html.unescape(re.sub(r"\s+", " ", summary)).strip()
                      if headline and link.startswith("http") and published_at >= now - timedelta(hours=72):
                          news_items.append({
                              "source": source_name,
                              "headline": headline,
                              "summary": summary[:900],
                              "url": link,
                              "published": published_at.isoformat(),
                              "published_dt": published_at,
                          })
                  print(f"Loaded current headlines from {source_name}.")
              except Exception as error:
                  print(f"News feed unavailable ({source_name}): {error}")

          unique_items = {}
          for item in news_items:
              key_title = re.sub(r"[^a-z0-9 ]", "", item["headline"].lower())
              unique_items[(item["source"], key_title)] = item
          news_items = sorted(unique_items.values(), key=lambda item: item["published_dt"], reverse=True)
          if not news_items:
              raise SystemExit("No current news feeds were available. Rerun the workflow later.")

          def headline_tokens(value):
              ignored = {"the", "and", "for", "with", "from", "that", "this", "says", "after", "over", "into", "amid", "what", "why", "how", "its", "their", "has", "have", "are", "was", "were"}
              return {word for word in re.findall(r"[a-z0-9]+", value.lower()) if len(word) > 2 and word not in ignored}

          for item in news_items:
              own = headline_tokens(item["headline"])
              corroborating = []
              for other in news_items:
                  if other is item or other["source"] == item["source"]:
                      continue
                  other_tokens = headline_tokens(other["headline"])
                  overlap = len(own & other_tokens) / max(1, len(own | other_tokens))
                  if overlap >= 0.22:
                      corroborating.append(other)
              item["corroborating"] = corroborating
              item["story_score"] = len({other["source"] for other in corroborating})

          selected_item = max(
              news_items,
              key=lambda item: (item["published_dt"] >= now - timedelta(hours=24), item["story_score"], item["published_dt"])
          )
          related_items = [selected_item] + selected_item["corroborating"]
          related_items = sorted(related_items, key=lambda item: item["published_dt"], reverse=True)[:6]
          topic = selected_item["headline"]

          class ArticleParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_paragraph = False
                  self.paragraph_parts = []
                  self.paragraphs = []
                  self.meta_description = ""
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag.lower() == "p":
                      self.in_paragraph = True
                      self.paragraph_parts = []
                  if tag.lower() == "meta":
                      name = (attributes.get("name") or attributes.get("property") or "").lower()
                      if name in ("description", "og:description", "twitter:description") and not self.meta_description:
                          self.meta_description = attributes.get("content", "")
              def handle_data(self, data):
                  if self.in_paragraph:
                      value = data.strip()
                      if value:
                          self.paragraph_parts.append(value)
              def handle_endtag(self, tag):
                  if tag.lower() == "p" and self.in_paragraph:
                      paragraph = " ".join(self.paragraph_parts).strip()
                      if len(paragraph) > 35:
                          self.paragraphs.append(paragraph)
                      self.in_paragraph = False
                      self.paragraph_parts = []

          news_sources = []
          for item in related_items:
              article_text = ""
              try:
                  article_response = requests.get(
                      item["url"],
                      headers={"User-Agent": "SignalBrief/1.0 (current-affairs research)"},
                      timeout=18
                  )
                  article_response.raise_for_status()
                  parser = ArticleParser()
                  parser.feed(article_response.text[:1500000])
                  article_text = " ".join(parser.paragraphs)
                  if len(article_text) < 250:
                      article_text = parser.meta_description
              except Exception as error:
                  print(f"Could not retrieve full article from {item['source']}; using its RSS summary: {error}")
              if not article_text:
                  article_text = item["summary"]
              article_text = re.sub(r"\s+", " ", html.unescape(article_text)).strip()[:2600]
              news_sources.append({key: item[key] for key in ("source", "headline", "summary", "url", "published")})
              news_sources[-1]["article_excerpt"] = article_text

          (out / "topic.txt").write_text(topic, encoding="utf-8")
          (out / "news-sources.json").write_text(json.dumps(news_sources, indent=2, ensure_ascii=False), encoding="utf-8")
          research = "\n\n".join(
              f"SOURCE: {item['source']}\nPUBLISHED: {item['published']}\nHEADLINE: {item['headline']}\nRSS SUMMARY: {item['summary']}\nARTICLE EXCERPT (when accessible): {item['article_excerpt']}\nURL: {item['url']}"
              for item in news_sources
          )

          prompt = f"""You are the research writer for SIGNAL BRIEF, a current-affairs YouTube channel.
          Create a clear, compelling, accurate news explainer based on the recent source material below.
          Selected story: {topic}
          Current UTC date: {now.strftime('%Y-%m-%d')}

          SOURCE MATERIAL (headlines, summaries, publication dates and URLs from live news feeds):
          {research}

          Write 650–800 spoken words in natural British English. Aim for about 725 words, and never return fewer than 600 words. Open with the most important verified
          development and its date. Explain what happened, who is involved, why it matters now, what is
          confirmed, what remains uncertain, and what to watch next. Make the story understandable to a
          viewer who has not followed it before.

          Research and accuracy rules:
          - Use only claims supported by the source material or uncontroversial background context.
          - Attribute allegations, official statements and disputed claims to the source or named speaker.
          - Do not invent quotes, numbers, dates, eyewitness details, motives, or future outcomes.
          - If only one source covers a claim, explicitly frame it as that outlet's reporting rather than
            independently confirmed fact. Do not claim independent corroboration unless the supplied
            sources genuinely support the same event.
          - If source summaries disagree or details are missing, state that clearly instead of guessing.
          - Avoid sensationalism, partisan advocacy, graphic detail, and presenting speculation as fact.
          - Do not use generic filler or a long channel introduction. End with the key implication and
            the next development viewers should monitor, without pretending to predict the future.
          - Return only spoken narration. No title, headings, bullet points, citations, stage directions,
            or production notes."""

          response = gemini_post(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
              headers={"x-goog-api-key": key},
              json={
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.7,
                      "maxOutputTokens": 1800
                  }
              },
              timeout=(20, 300)
          )
          response.raise_for_status()
          data = response.json()
          script = "".join(
              part.get("text", "")
              for part in data["candidates"][0]["content"]["parts"]
          ).strip()

          if not script:
              raise SystemExit("Script generation returned empty text.")

          word_count = len(script.split())
          if word_count < 600:
              print(f"Narration draft is only {word_count} words; asking Gemini to expand it.")
              expansion_prompt = f"""You are the research writer for SIGNAL BRIEF. Expand the narration below into 650–800 spoken words in natural British English, aiming for about 725 words. Preserve its factual meaning and only use information supported by the narration and source material. Do not add invented facts, quotes, dates, numbers, motives, or predictions. Add useful verified context, explain why the development matters, clarify what is known and uncertain, and end with what to watch next. Return only the complete spoken narration, with no title, headings, bullet points, citations, or production notes.
          
          SOURCE MATERIAL:
          {research}
          
          CURRENT NARRATION:
          {script}"""
              expansion_response = gemini_post(
                  "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
                  headers={"x-goog-api-key": key},
                  json={
                      "contents": [{"parts": [{"text": expansion_prompt}]}],
                      "generationConfig": {"temperature": 0.5, "maxOutputTokens": 2200}
                  },
                  timeout=(20, 300)
              )
              expansion_response.raise_for_status()
              expansion_data = expansion_response.json()
              expanded_script = "".join(
                  part.get("text", "")
                  for part in expansion_data["candidates"][0]["content"]["parts"]
              ).strip()
              if expanded_script:
                  script = expanded_script
                  word_count = len(script.split())

          if word_count < 500:
              raise SystemExit(
                  f"Narration generation failed: only {word_count} words after expansion; "
                  "at least 500 are required. Rerun the workflow to try again."
              )

          (out / "script.txt").write_text(script, encoding="utf-8")
          print(f"Script generated: {word_count} words.")

          payload = {
              "contents": [{"parts": [{"text": script}]}],
              "generationConfig": {
                  "responseModalities": ["AUDIO"],
                  "speechConfig": {
                      "voiceConfig": {
                          "prebuiltVoiceConfig": {
                              "voiceName": "Kore"
                          }
                      }
                  }
              }
          }

          response = gemini_post(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent",
              headers={
                  "x-goog-api-key": key,
                  "Content-Type": "application/json"
              },
              json=payload,
              timeout=(20, 300)
          )

          if not response.ok:
              print(response.text[:2000])
              response.raise_for_status()

          audio = None
          mime_type = ""
          for part in response.json().get("candidates", [{}])[0].get("content", {}).get("parts", []):
              inline_data = part.get("inlineData") or part.get("inline_data") or {}
              if inline_data.get("data"):
                  audio = inline_data["data"]
                  mime_type = inline_data.get("mimeType") or inline_data.get("mime_type") or ""
                  break

          if not audio:
              raise SystemExit("No narration audio returned by Gemini TTS.")

          audio_bytes = base64.b64decode(audio)
          if audio_bytes.startswith(b"RIFF"):
              (out / "narration.wav").write_bytes(audio_bytes)
          else:
              sample_rate_match = re.search(r"rate=(\\d+)", mime_type)
              sample_rate = int(sample_rate_match.group(1)) if sample_rate_match else 24000
              with wave.open(str(out / "narration.wav"), "wb") as wav_file:
                  wav_file.setnchannels(1)
                  wav_file.setsampwidth(2)
                  wav_file.setframerate(sample_rate)
                  wav_file.writeframes(audio_bytes)

          print("Narration generated.")


          visual_prompt = f"""You are the visual researcher for SIGNAL BRIEF, a current-affairs news video.
          The narration is divided into very short sequential passages. Return ONLY valid JSON:
          {{"scenes":[{{"index":1,"title":"specific visual subject","query":"specific Wikimedia Commons search phrase"}}]}}
          Create exactly one scene for every passage, preserving every index and the order.
          Each image must directly illustrate the exact words in that passage, not merely the general story.
          Use named people, places, buildings, maps, transport, public events, relevant documents, landscapes,
          company logos or other factual context only when supported by the current story and source material.
          Never invent a photo or imply a stock image depicts the actual event if it does not. For a passage
          with no concrete visual noun, use a relevant location, organisation, person or factual context from
          the supplied current story. Do not search for weapons or ordnance; use the surrounding location,
          people, records or context instead. Queries should be specific, 3–7 words, and searchable on
          Wikimedia Commons. Avoid generic mood words. Current story: {topic}

          PASSAGES:
          """
          script_words = script.split()
          chunk_size = 7
          scene_count = (len(script_words) + chunk_size - 1) // chunk_size
          passages = []
          for index in range(scene_count):
              passage_words = script_words[index * chunk_size:(index + 1) * chunk_size]
              if passage_words:
                  passages.append({
                      "index": index + 1,
                      "text": " ".join(passage_words)
                  })

          visual_input = visual_prompt + json.dumps(passages, ensure_ascii=False)
          visual_response = gemini_post(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
              headers={"x-goog-api-key": key},
              json={
                  "contents": [{"parts": [{"text": visual_input}]}],
                  "generationConfig": {
                      "temperature": 0.2,
                      "maxOutputTokens": 7000,
                      "responseMimeType": "application/json"
                  }
              },
              timeout=(20, 300)
          )
          visual_response.raise_for_status()
          visual_data = visual_response.json()
          visual_text = "".join(
              part.get("text", "")
              for part in visual_data["candidates"][0]["content"]["parts"]
          ).strip()
          visual_text = re.sub(r"^```(?:json)?\s*|\s*```$", "", visual_text)
          try:
              visual_scenes = json.loads(visual_text).get("scenes", [])
          except json.JSONDecodeError:
              visual_scenes = []

          scene_by_index = {
              int(item.get("index", 0)): item
              for item in visual_scenes
              if str(item.get("index", "")).isdigit()
          }

          def clean_text(value):
              value = re.sub(r"<[^>]*>", "", str(value or ""))
              return html.unescape(value).strip()

          def tokens(value):
              ignored = {
                  "the", "and", "for", "with", "from", "that", "this", "into",
                  "near", "about", "during", "after", "before", "image", "photo",
                  "historic", "historical", "documentary", "scene", "view"
              }
              return {
                  word for word in re.findall(r"[a-z0-9]+", value.lower())
                  if len(word) > 2 and word not in ignored
              }

          def make_context_card(path, title, passage):
              from PIL import ImageDraw, ImageFont
              canvas = Image.new("RGB", (1920, 1080), (13, 16, 22))
              draw = ImageDraw.Draw(canvas)
              for y in range(0, 1080, 4):
                  shade = int(18 + 16 * y / 1080)
                  draw.line((0, y, 1920, y), fill=(shade, shade + 2, shade + 8), width=4)
              draw.rectangle((120, 130, 1800, 950), outline=(85, 105, 128), width=3)
              try:
                  heading_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 66)
                  body_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 30)
              except OSError:
                  heading_font = ImageFont.load_default()
                  body_font = ImageFont.load_default()
              draw.text((180, 205), "CURRENT NEWS CONTEXT", font=body_font, fill=(155, 177, 201))
              title_lines = []
              current = ""
              for word in (title or "Documentary context").split():
                  candidate = (current + " " + word).strip()
                  if len(candidate) > 30:
                      title_lines.append(current)
                      current = word
                  else:
                      current = candidate
              if current:
                  title_lines.append(current)
              y = 330
              for line in title_lines[:4]:
                  draw.text((180, y), line, font=heading_font, fill=(240, 243, 248))
                  y += 88
              excerpt = " ".join(passage.split()[:26])
              if len(excerpt) > 180:
                  excerpt = excerpt[:177].rsplit(" ", 1)[0] + "..."
              draw.text((180, 790), excerpt, font=body_font, fill=(174, 185, 199))
              canvas.save(path, quality=92)

          def image_candidates(search_query):
              params = {
                  "action": "query",
                  "generator": "search",
                  "gsrsearch": search_query,
                  "gsrnamespace": 6,
                  "gsrlimit": 18,
                  "prop": "imageinfo",
                  "iiprop": "url|extmetadata",
                  "iiurlwidth": 1920,
                  "format": "json"
              }
              response = requests.get(
                  "https://commons.wikimedia.org/w/api.php",
                  params=params,
                  headers={"User-Agent": "SignalBrief/1.0 (news video with source attribution)"},
                  timeout=45
              )
              response.raise_for_status()
              pages = response.json().get("query", {}).get("pages", {}).values()
              query_tokens = tokens(search_query)
              ranked = []
              for page in pages:
                  title = page.get("title", "")
                  info_list = page.get("imageinfo", [])
                  if not info_list:
                      continue
                  info = info_list[0]
                  metadata = info.get("extmetadata", {})
                  description = clean_text(metadata.get("ImageDescription", {}).get("value", ""))
                  categories = clean_text(metadata.get("Categories", {}).get("value", ""))
                  searchable = title + " " + description + " " + categories
                  match_tokens = tokens(searchable)
                  overlap = len(query_tokens & match_tokens)
                  score = overlap / max(1, len(query_tokens))
                  if overlap < 2 or score < 0.28:
                      continue
                  license_name = clean_text(metadata.get("LicenseShortName", {}).get("value", ""))
                  copyright_status = clean_text(metadata.get("Copyrighted", {}).get("value", "")).lower()
                  license_lower = license_name.lower()
                  reusable = (
                      "cc by" in license_lower
                      or "cc0" in license_lower
                      or "public domain" in license_lower
                      or "public domain" in copyright_status
                      or copyright_status == "false"
                  )
                  if not reusable:
                      continue
                  image_url = info.get("thumburl") or info.get("url", "")
                  if not image_url.startswith("https://"):
                      continue
                  ranked.append((score, {
                      "url": image_url,
                      "title": title,
                      "creator": clean_text(metadata.get("Artist", {}).get("value", "")),
                      "license": license_name,
                      "license_url": clean_text(metadata.get("LicenseUrl", {}).get("value", "")),
                      "foreign_landing_url": f"https://commons.wikimedia.org/?curid={page.get('pageid', '')}",
                      "attribution": clean_text(
                          metadata.get("Attribution", {}).get("value", "")
                          or metadata.get("Credit", {}).get("value", "")
                          or metadata.get("Artist", {}).get("value", "")
                      ),
                      "match_score": round(score, 3)
                  }))
              ranked.sort(key=lambda pair: pair[0], reverse=True)
              return [item for _, item in ranked]

          attribution = []
          scene_manifest = []
          used_titles = set()

          for scene_index, passage in enumerate(passages, start=1):
              planned = scene_by_index.get(scene_index, {})
              scene_title = clean_text(planned.get("title", "")) or f"Documentary scene {scene_index}"
              search_query = clean_text(planned.get("query", ""))
              if len(tokens(search_query)) < 2:
                  search_query = scene_title
              print(f"Scene {scene_index:02d} image search: {search_query}")
              selected = None
              try:
                  for candidate in image_candidates(search_query):
                      if candidate["title"] in used_titles:
                          continue
                      try:
                          request = urllib.request.Request(
                              candidate["url"],
                              headers={"User-Agent": "SignalBrief/1.0"}
                          )
                          with urllib.request.urlopen(request, timeout=30) as image_response:
                              content_type = image_response.headers.get(
                                  "Content-Type", ""
                              ).split(";")[0].lower()
                              raw = image_response.read(8 * 1024 * 1024 + 1)
                          if content_type not in ("image/jpeg", "image/png", "image/webp"):
                              continue
                          if len(raw) > 8 * 1024 * 1024:
                              continue
                          image = Image.open(io.BytesIO(raw))
                          image.load()
                          if image.width < 800 or image.height < 450:
                              continue
                          filename = f"image-{scene_index}.jpg"
                          image.convert("RGB").save(images / filename, quality=91)
                          candidate["file"] = filename
                          candidate["scene"] = scene_index
                          candidate["search_query"] = search_query
                          selected = candidate
                          used_titles.add(candidate["title"])
                          print(
                              f"Matched scene {scene_index:02d}: "
                              f"{candidate['title']} (score {candidate['match_score']})"
                          )
                          break
                      except Exception as error:
                          print("Skipping candidate:", str(error))
              except Exception as error:
                  print(f"Image search failed for scene {scene_index}: {error}")

              if selected:
                  attribution.append(selected)
                  visual_kind = "commons"
              else:
                  filename = f"image-{scene_index}.jpg"
                  make_context_card(images / filename, scene_title, passage["text"])
                  attribution.append({
                      "file": filename,
                      "title": scene_title + " — generated context card",
                      "creator": "Signal Brief",
                      "attribution": "Generated contextual graphic; no external image used",
                      "license": "Generated graphic",
                      "license_url": "",
                      "foreign_landing_url": "",
                      "scene": scene_index,
                      "search_query": search_query,
                      "match_score": 0
                  })
                  visual_kind = "context_card"
                  print(f"Scene {scene_index:02d}: no sufficiently relevant licensed image; using context card.")

              scene_manifest.append({
                  "index": scene_index,
                  "title": scene_title,
                  "query": search_query,
                  "word_count": len(passage["text"].split()),
                  "file": filename,
                  "visual_kind": visual_kind
              })

          (out / "attribution.json").write_text(
              json.dumps(attribution, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          (out / "scenes.json").write_text(
              json.dumps(scene_manifest, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          duration = float(subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(out / "narration.wav")
          ], text=True).strip())

          words = script.split()

          def stamp(seconds):
              milliseconds = int(seconds * 1000)
              hours, milliseconds = divmod(milliseconds, 3600000)
              minutes, milliseconds = divmod(milliseconds, 60000)
              seconds, milliseconds = divmod(milliseconds, 1000)
              return f"{hours:02}:{minutes:02}:{seconds:02},{milliseconds:03}"

          groups = [words[i:i + 8] for i in range(0, len(words), 8)]

          with open(out / "captions.srt", "w", encoding="utf-8") as file:
              for index, group in enumerate(groups):
                  start = duration * index / len(groups)
                  end = duration * (index + 1) / len(groups)
                  file.write(
                      f"{index + 1}\n{stamp(start)} --> {stamp(end)}\n"
                      + " ".join(group) + "\n\n"
                  )

          scene_total = sum(max(1, item.get("word_count", 1)) for item in scene_manifest)
          scene_timings = []
          cursor = 0.0
          for item in scene_manifest:
              segment_duration = duration * max(1, item.get("word_count", 1)) / scene_total
              scene_timings.append({
                  **item,
                  "start": cursor,
                  "duration": segment_duration
              })
              cursor += segment_duration

          (out / "scene-timings.json").write_text(
              json.dumps(scene_timings, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          (out / "duration.txt").write_text(str(duration), encoding="utf-8")
          print(f"Prepared script, narration and {len(attribution)} scene-matched visuals.")
          PY

          python build.py

