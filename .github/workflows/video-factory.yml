
name: AI YouTube Factory - Build Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: read

concurrency:
  group: ai-youtube-factory
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests pillow google-api-python-client google-auth google-auth-httplib2

      - name: Generate and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p output/images output/scenes

          cat > build.py <<'PYTHON'
          import os
          import re
          import io
          import json
          import time
          import wave
          import base64
          import subprocess
          from pathlib import Path

          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          ROOT = Path("output")
          IMAGES = ROOT / "images"
          SCENES = ROOT / "scenes"
          ROOT.mkdir(exist_ok=True)
          IMAGES.mkdir(exist_ok=True)
          SCENES.mkdir(exist_ok=True)

          API_KEY = os.environ["GEMINI_API_KEY"]
          MODEL = "gemini-3.5-flash-lite"
          TTS_MODEL = "gemini-2.5-flash-preview-tts"

          session = requests.Session()
          retry = Retry(
              total=3,
              connect=3,
              read=3,
              backoff_factor=2,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=["GET", "POST"],
              respect_retry_after_header=True
          )
          adapter = HTTPAdapter(max_retries=retry)
          session.mount("https://", adapter)
          session.headers.update({
              "User-Agent": "AIYouTubeFactory/1.0"
          })

          def save_text(name, value):
              (ROOT / name).write_text(value, encoding="utf-8")

          def gemini_generate(prompt):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + MODEL + ":generateContent"
              )
              response = session.post(
                  url,
                  params={"key": API_KEY},
                  json={
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {
                          "temperature": 0.8,
                          "responseMimeType": "application/json"
                      }
                  },
                  timeout=180
              )
              response.raise_for_status()
              data = response.json()
              text = data["candidates"][0]["content"]["parts"][0]["text"]
              text = re.sub(r"^```(?:json)?\s*", "", text.strip())
              text = re.sub(r"\s*```$", "", text)
              return json.loads(text)

          prompt = """
          Create an original investigation documentary for a YouTube channel
          called The Midnight Archive.

          Choose a compelling real historical mystery, unexplained event,
          missing-person case, disputed historical incident, or strange
          discovery. Prioritise subjects with a genuine investigation,
          documented evidence, competing explanations, and an unresolved
          question worth exploring.

          The recurring fictional investigators are Mara Vale, a determined
          archivist, and Eli Ward, a careful researcher. They may frame the
          investigation, but never invent real evidence or claim fictional
          conversations actually happened.

          Be responsible with facts. Do not invent quotations, sources,
          dates, evidence, or claims about real people. Clearly distinguish
          documented facts from theories and speculation. If a detail is
          uncertain, say so. The investigators are fictional.

          Create a gripping opening, establish the case, examine evidence,
          investigate leads, consider competing explanations, and reach a
          thoughtful conclusion. Avoid filler and repetitive narration.

          Return valid JSON only in this structure:
          {
            "title": "Accurate, intriguing investigation title",
            "description": "Documentary description and relevant disclosure",
            "scenes": [
              {
                "narration": "Spoken documentary narration",
                "visual_search": "Exact subject to depict in the scene",
                "visual_description": "Composition, lighting, location and mood"
              }
            ]
          }

          Requirements:
          - Exactly 12 scenes.
          - Approximately 900 to 1100 words total.
          - Each scene must advance the investigation.
          - Scene 1 must immediately establish a compelling mystery.
          - Use natural spoken English.
          - Give each scene a distinct visual that matches its narration.
          - visual_search is an image-generation subject, not web-search keywords.
          - visual_description must describe concrete visual details.
          - Use historically appropriate settings, clothing, objects and architecture.
          - Do not fabricate historical documents or show invented text as evidence.
          - Images are illustrative reconstructions, not authentic photographs.
          - Do not include sound cues or production instructions in narration.
          - Do not use misleading clickbait.
          - Do not imitate a living artist.
          """

          print("Generating investigation script...")
          story = gemini_generate(prompt)

          if len(story.get("scenes", [])) != 12:
              raise RuntimeError("Expected exactly 12 scenes.")

          if not story.get("title") or not story.get("description"):
              raise RuntimeError("The story is missing its title or description.")

          for scene in story["scenes"]:
              for field in ("narration", "visual_search", "visual_description"):
                  if not isinstance(scene.get(field), str) or not scene[field].strip():
                      raise RuntimeError("A scene is missing " + field)

          narration = "\n\n".join(
              scene["narration"].strip() for scene in story["scenes"]
          )
          title = story["title"].strip()
          description = story["description"].strip()

          save_text("title.txt", title)
          save_text("description.txt", description)
          save_text("script.txt", narration)
          save_text("scenes.json", json.dumps(story, ensure_ascii=False, indent=2))

          def generate_audio(text):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + TTS_MODEL + ":generateContent"
              )
              response = session.post(
                  url,
                  params={"key": API_KEY},
                  json={
                      "contents": [{
                          "parts": [{
                              "text": (
                                  "Read this narration naturally in a warm, "
                                  "clear investigative documentary voice. "
                                  "Use measured pacing and dramatic pauses. "
                                  "Narration: " + text
                              )
                          }]
                      }],
                      "generationConfig": {
                          "responseModalities": ["AUDIO"],
                          "speechConfig": {
                              "voiceConfig": {
                                  "prebuiltVoiceConfig": {
                                      "voiceName": "Kore"
                                  }
                              }
                          }
                      }
                  },
                  timeout=300
              )
              response.raise_for_status()
              data = response.json()

              for candidate in data.get("candidates", []):
                  for part in candidate.get("content", {}).get("parts", []):
                      inline = part.get("inlineData") or part.get("inline_data")
                      if inline and inline.get("data"):
                          return base64.b64decode(inline["data"])

              raise RuntimeError("Gemini returned no narration audio.")

          print("Generating narration...")
          pcm = generate_audio(narration)
          audio_path = ROOT / "narration.wav"

          with wave.open(str(audio_path), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(24000)
              wav.writeframes(pcm)

          with wave.open(str(audio_path), "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()

          if duration <= 0:
              raise RuntimeError("Narration has zero duration.")

          save_text("duration.txt", str(duration))

          HORDE_API = "https://aihorde.net/api/v2"
          HORDE_HEADERS = {
              "apikey": "0000000000",
              "Client-Agent": "AIYouTubeFactory:1.0:GitHubActions"
          }

          def generate_ai_image(scene, index):
              prompt = (
                  "prompt: Create a cinematic historical investigation "
                  "documentary illustration. Wide landscape composition, "
                  "detailed environment, realistic materials, atmospheric "
                  "lighting, natural shadows, restrained documentary colours. "
                  "This is an illustrative reconstruction, not authentic "
                  "historical evidence. Subject: "
                  + scene["visual_search"]
                  + ". Scene direction: "
                  + scene["visual_description"]
                  + ". Narrative context: "
                  + scene["narration"][:350]
                  + ". Respect the correct historical period, location, "
                  "clothing and objects. No text, letters, captions, "
                  "watermarks, logos or collages. "
                  "negative: blurry, low quality, distorted faces, "
                  "deformed hands, modern objects in historical scenes, "
                  "text, watermark, logo, collage"
              )

              client = requests.Session()
              client.headers.update(HORDE_HEADERS)
              request_id = None

              try:
                  response = client.post(
                      HORDE_API + "/generate/async",
                      json={
                          "prompt": prompt,
                          "params": {
                              "width": 768,
                              "height": 448,
                              "steps": 20,
                              "n": 1
                          },
                          "nsfw": False,
                          "censor_nsfw": True,
                          "r2": True
                      },
                      timeout=30
                  )
                  response.raise_for_status()
                  request_id = response.json().get("id")

                  if not request_id:
                      raise RuntimeError("No generation ID was returned.")

                  print(f"Scene {index}: waiting for free AI image generation...")
                  deadline = time.monotonic() + 180

                  while time.monotonic() < deadline:
                      time.sleep(5)

                      check = client.get(
                          f"{HORDE_API}/generate/check/{request_id}",
                          timeout=20
                      )
                      check.raise_for_status()
                      status = check.json()

                      if status.get("faulted"):
                          raise RuntimeError("AI Horde generation failed.")

                      if status.get("done"):
                          result = client.get(
                              f"{HORDE_API}/generate/status/{request_id}",
                              timeout=30
                          )
                          result.raise_for_status()

                          generations = result.json().get("generations", [])
                          if not generations:
                              raise RuntimeError("No image was returned.")

                          image_url = generations[0].get("img", "")
                          if not image_url.startswith("https://"):
                              raise RuntimeError("Invalid generated image URL.")

                          downloaded = client.get(image_url, timeout=45)
                          downloaded.raise_for_status()

                          with Image.open(io.BytesIO(downloaded.content)) as im:
                              im.verify()

                          destination = IMAGES / f"image-{index}.jpg"

                          with Image.open(io.BytesIO(downloaded.content)) as im:
                              converted = im.convert("RGB")
                              if converted.width < 512 or converted.height < 300:
                                  raise RuntimeError("Image resolution too low.")
                              converted.save(destination, "JPEG", quality=92)

                          print(f"Scene {index}: AI image generated.")
                          return destination

                  raise TimeoutError("Image generation timed out.")

              finally:
                  client.close()

          def make_fallback_image(scene, index):
              width, height = 1920, 1080
              image = Image.new("RGB", (width, height), (15, 19, 26))
              draw = ImageDraw.Draw(image)

              for x in range(0, width, 60):
                  draw.line((x, 0, x, height), fill=(25, 32, 42), width=1)

              for y in range(0, height, 60):
                  draw.line((0, y, width, y), fill=(25, 32, 42), width=1)

              draw.rectangle(
                  (55, 55, width - 55, height - 55),
                  outline=(115, 124, 137), width=3
              )

              try:
                  font = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 42
                  )
                  heading = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 56
                  )
              except OSError:
                  font = ImageFont.load_default()
                  heading = font

              draw.text((100, 100), "THE MIDNIGHT ARCHIVE",
                        font=heading, fill=(236, 232, 220))
              draw.line((100, 190, width - 100, 190),
                        fill=(115, 124, 137), width=3)
              draw.text((100, 245), f"CASE FILE  /  SCENE {index:02d}",
                        font=font, fill=(172, 184, 197))

              subject = scene["visual_search"].strip()
              words = subject.split()
              lines = []
              current = ""

              for word in words:
                  test = (current + " " + word).strip()
                  if draw.textbbox((0, 0), test, font=font)[2] < width - 220:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              y = 380
              for line in lines[:6]:
                  draw.text((100, y), line, font=font,
                            fill=(230, 219, 196))
                  y += 65

              draw.text((100, height - 145),
                        "ILLUSTRATIVE CASE FILE",
                        font=font, fill=(172, 184, 197))

              destination = IMAGES / f"image-{index}.jpg"
              image.save(destination, "JPEG", quality=90)
              return destination

          attribution = []

          print("Generating matching images for all 12 scenes...")

          for index, scene in enumerate(story["scenes"], start=1):
              try:
                  generate_ai_image(scene, index)
                  source = "AI Horde"
              except Exception as exc:
                  print(f"Scene {index}: AI image unavailable: {exc}")
                  make_fallback_image(scene, index)
                  source = "Locally generated case-file graphic"

              attribution.append({
                  "scene": index,
                  "subject": scene["visual_search"],
                  "source": source,
                  "note": (
                      "AI-generated illustrative reconstruction"
                      if source == "AI Horde"
                      else "Fallback graphic; not an AI-generated photograph"
                  )
              })

          save_text("attribution.json", json.dumps(attribution, indent=2))

          def get_font(size):
              paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
              ]
              for path in paths:
                  if Path(path).exists():
                      return ImageFont.truetype(path, size)
              return ImageFont.load_default()

          def wrap_words(draw, text, font, max_width):
              lines = []
              current = ""

              for word in text.split():
                  candidate = (current + " " + word).strip()
                  if draw.textbbox((0, 0), candidate, font=font)[2] <= max_width:
                      current = candidate
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              return lines

          total_words = sum(
              len(scene["narration"].split()) for scene in story["scenes"]
          )

          def make_scene_video(scene, index):
              image_path = IMAGES / f"image-{index}.jpg"
              frame_path = SCENES / f"scene-{index}.mp4"

              with Image.open(image_path) as original:
                  frame = ImageOps.fit(
                      original.convert("RGB"),
                      (1920, 1080),
                      method=Image.Resampling.LANCZOS
                  )

              overlay = Image.new("RGBA", frame.size, (0, 0, 0, 0))
              overlay_draw = ImageDraw.Draw(overlay)
              overlay_draw.rectangle(
                  (0, 0, 1920, 175), fill=(0, 0, 0, 165)
              )
              overlay_draw.rectangle(
                  (0, 875, 1920, 1080), fill=(0, 0, 0, 175)
              )

              frame = Image.alpha_composite(
                  frame.convert("RGBA"), overlay
              ).convert("RGB")

              draw = ImageDraw.Draw(frame)
              title_font = get_font(46)
              small_font = get_font(30)

              draw.text(
                  (75, 45), "THE MIDNIGHT ARCHIVE",
                  font=title_font, fill=(255, 255, 255)
              )
              draw.text(
                  (78, 112), f"CASE FILE  /  SCENE {index:02d}",
                  font=small_font, fill=(220, 220, 220)
              )

              lines = wrap_words(
                  draw, scene["visual_description"], small_font, 1750
              )[:3]

              y = 905
              for line in lines:
                  draw.text(
                      (75, y), line, font=small_font,
                      fill=(255, 255, 255)
                  )
                  y += 42

              frame_path_image = SCENES / f"scene-{index}.jpg"
              frame.save(frame_path_image, "JPEG", quality=93)

              words = len(scene["narration"].split())
              scene_duration = max(duration * words / max(total_words, 1), 1.0)

              subprocess.run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(frame_path_image),
                  "-t", f"{scene_duration:.3f}",
                  "-vf", "scale=1920:1080,format=yuv420p",
                  "-r", "30",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-an",
                  str(frame_path)
              ], check=True, stdout=subprocess.DEVNULL,
                 stderr=subprocess.PIPE)

              return frame_path

          print("Building video scenes...")

          for index, scene in enumerate(story["scenes"], start=1):
              make_scene_video(scene, index)

          concat_file = SCENES / "concat.txt"
          with concat_file.open("w", encoding="utf-8") as file:
              for index in range(1, 13):
                  path = (SCENES / f"scene-{index}.mp4").resolve()
                  file.write("file '" + str(path) + "'\n")

          silent_video = ROOT / "silent.mp4"

          subprocess.run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "23",
              "-pix_fmt", "yuv420p",
              str(silent_video)
          ], check=True)

          final_video = ROOT / "final-video.mp4"

          subprocess.run([
              "ffmpeg", "-y",
              "-i", str(silent_video),
              "-i", str(audio_path),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video)
          ], check=True)

          print("Writing subtitles...")

          seconds_per_word = duration / max(total_words, 1)
          srt_lines = []
          word_cursor = 0
          subtitle_index = 1

          def timestamp(seconds):
              milliseconds = int(round(seconds * 1000))
              hours = milliseconds // 3600000
              milliseconds %= 3600000
              minutes = milliseconds // 60000
              milliseconds %= 60000
              secs = milliseconds // 1000
              milliseconds %= 1000
              return (
                  f"{hours:02}:{minutes:02}:"
                  f"{secs:02},{milliseconds:03}"
              )

          for scene in story["scenes"]:
              words = scene["narration"].split()

              for offset in range(0, len(words), 8):
                  chunk = words[offset:offset + 8]
                  start = word_cursor * seconds_per_word
                  end = min(
                      (word_cursor + len(chunk)) * seconds_per_word,
                      duration
                  )

                  srt_lines.extend([
                      str(subtitle_index),
                      f"{timestamp(start)} --> {timestamp(end)}",
                      " ".join(chunk),
                      ""
                  ])

                  word_cursor += len(chunk)
                  subtitle_index += 1

          save_text("captions.srt", "\n".join(srt_lines))
          save_text(
              "upload-notes.txt",
              "AI-generated images and fallback graphics are listed in "
              "attribution.json. Generated illustrations are not authentic "
              "historical photographs. Verify historical claims before publishing."
          )

          print("Connecting to YouTube...")

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

          request_body = {
              "snippet": {
                  "title": title[:100],
                  "description": (
                      description
                      + "\n\nThis documentary may contain AI-generated "
                      "illustrative reconstructions. See the video context "
                      "for distinctions between historical facts and theories."
                  )[:5000],
                  "categoryId": "27",
                  "tags": [
                      "investigation", "mystery", "history",
                      "documentary", "historical mysteries",
                      "The Midnight Archive"
                  ],
                  "defaultLanguage": "en"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          upload = youtube.videos().insert(
              part="snippet,status",
              body=request_body,
              media_body=MediaFileUpload(
                  str(final_video),
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          result = None

          while result is None:
              status, result = upload.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress() * 100)}%")

          video_id = result.get("id", "")
          save_text("youtube-video-id.txt", video_id)
          save_text(
              "youtube-video-url.txt",
              "https://www.youtube.com/watch?v=" + video_id
          )

          print("Upload completed.")
          print("Video ID: " + video_id)
          print("The video is private until you change its visibility.")
          PYTHON

          python build.py

      - name: Save generated video and project files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-factory-output
          path: output/
          if-no-files-found: warn
          retention-days: 7
