
name: AI YouTube Factory - Build Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: read

concurrency:
  group: ai-youtube-factory
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests pillow google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p output/images output/scenes

          cat > build.py <<'PYTHON'
          import os
          import re
          import json
          import time
          import math
          import wave
          import struct
          import subprocess
          from pathlib import Path

          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          ROOT = Path("output")
          IMAGES = ROOT / "images"
          SCENES = ROOT / "scenes"
          ROOT.mkdir(exist_ok=True)
          IMAGES.mkdir(exist_ok=True)
          SCENES.mkdir(exist_ok=True)

          API_KEY = os.environ["GEMINI_API_KEY"]
          MODEL = "gemini-3.5-flash-lite"
          TTS_MODEL = "gemini-2.5-flash-preview-tts"

          session = requests.Session()
          retry = Retry(
              total=6,
              connect=4,
              read=4,
              backoff_factor=5,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=["GET", "POST"],
              respect_retry_after_header=True
          )
          adapter = HTTPAdapter(max_retries=retry)
          session.mount("https://", adapter)
          session.mount("http://", adapter)
          session.headers.update({
              "User-Agent": "AIYouTubeFactory/1.0 (https://github.com/)"
          })

          def save_text(name, value):
              (ROOT / name).write_text(value, encoding="utf-8")

          def gemini_generate(prompt):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + MODEL + ":generateContent"
              )
              response = session.post(
                  url,
                  params={"key": API_KEY},
                  json={
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {
                          "temperature": 0.9,
                          "responseMimeType": "application/json"
                      }
                  },
                  timeout=180
              )
              response.raise_for_status()
              data = response.json()
              text = data["candidates"][0]["content"]["parts"][0]["text"]
              text = re.sub(r"^```(?:json)?\s*", "", text.strip())
              text = re.sub(r"\s*```$", "", text)
              return json.loads(text)

          prompt = """
          Create a compelling original YouTube mystery documentary episode for
          a channel called The Midnight Archive.

          The recurring fictional investigators are Mara Vale, a determined
          archivist, and Eli Ward, a careful researcher. Their personalities
          should feel consistent, but this episode must stand on its own.

          Choose a fascinating historical mystery or strange real-world event.
          Treat real historical claims responsibly: do not invent quotations,
          claim fictional dialogue is real, or present speculation as fact.
          The investigators and any conversations involving them are fictional.

          Write an immersive, suspenseful story with a strong opening hook,
          escalating discoveries, meaningful character decisions, reversals,
          and a satisfying ending. Avoid repetitive filler, generic clickbait,
          and claims that the viewer must watch another video to understand it.

          Return valid JSON only in this exact structure:
          {
            "title": "A compelling accurate title",
            "description": "An engaging description including a note that
              the investigators are fictional where appropriate",
            "scenes": [
              {
                "narration": "Narration for this scene",
                "visual_search": "Specific search terms for a relevant real
                  photograph, historical place, document, or object",
                "visual_description": "A short cinematic description of
                  the scene's visual mood"
              }
            ]
          }

          Requirements:
          - Exactly 12 scenes.
          - Approximately 900 to 1100 words of total narration.
          - Each scene needs substantial narration, not just one sentence.
          - Scene 1 must hook the viewer within the first two sentences.
          - Every scene must move the investigation forward.
          - Use natural spoken English and short, clear sentences.
          - Do not include markdown, production instructions, or sound cues
            inside the narration.
          - Visual searches must describe concrete things likely to have
            photographs available in Wikimedia Commons.
          - Do not ask the image generator to imitate a living artist.
          - Do not make unsupported claims about real people or events.
          """

          print("Generating the episode...")
          story = gemini_generate(prompt)

          if len(story.get("scenes", [])) != 12:
              raise RuntimeError("The story did not contain exactly 12 scenes.")

          for scene in story["scenes"]:
              for field in ("narration", "visual_search", "visual_description"):
                  if not isinstance(scene.get(field), str) or not scene[field].strip():
                      raise RuntimeError("A scene is missing required text.")

          narration = "\n\n".join(
              scene["narration"].strip() for scene in story["scenes"]
          )
          title = story["title"].strip()
          description = story["description"].strip()

          save_text("title.txt", title)
          save_text("description.txt", description)
          save_text("script.txt", narration)
          save_text("scenes.json", json.dumps(story, ensure_ascii=False, indent=2))

          def generate_audio(text):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + TTS_MODEL + ":generateContent"
              )
              response = session.post(
                  url,
                  params={"key": API_KEY},
                  json={
                      "contents": [{
                          "parts": [{"text": "Read this narration naturally "
                                    "in a warm, clear documentary voice. "
                                    "Use measured pacing and dramatic pauses "
                                    "where appropriate. Narration: " + text}]
                      }],
                      "generationConfig": {
                          "responseModalities": ["AUDIO"],
                          "speechConfig": {
                              "voiceConfig": {
                                  "prebuiltVoiceConfig": {
                                      "voiceName": "Kore"
                                  }
                              }
                          }
                      }
                  },
                  timeout=300
              )
              response.raise_for_status()
              data = response.json()

              for candidate in data.get("candidates", []):
                  for part in candidate.get("content", {}).get("parts", []):
                      inline = part.get("inlineData") or part.get("inline_data")
                      if inline and inline.get("data"):
                          import base64
                          return base64.b64decode(inline["data"])

              raise RuntimeError(
                  "Gemini returned no audio. Check the TTS model and API access."
              )

          print("Generating narration audio...")
          pcm = generate_audio(narration)

          audio_path = ROOT / "narration.wav"

          with wave.open(str(audio_path), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(24000)
              wav.writeframes(pcm)

          def audio_duration(path):
              with wave.open(str(path), "rb") as wav:
                  return wav.getnframes() / wav.getframerate()

          duration = audio_duration(audio_path)
          if duration <= 0:
              raise RuntimeError("Narration audio has zero duration.")

          save_text("duration.txt", str(duration))

          def find_image(search_term, index):
              params = {
                  "action": "query",
                  "format": "json",
                  "generator": "search",
                  "gsrsearch": "filetype:bitmap " + search_term,
                  "gsrnamespace": 6,
                  "gsrlimit": 12,
                  "prop": "imageinfo",
                  "iiprop": "url|mime|thumbmime",
                  "iiurlwidth": 1280
              }

              time.sleep(5)
              response = session.get(
                  "https://commons.wikimedia.org/w/api.php",
                  params=params,
                  timeout=60
              )
              response.raise_for_status()
              pages = response.json().get("query", {}).get("pages", {})

              candidates = sorted(
                  pages.values(),
                  key=lambda page: (
                      not page.get("title", "").lower().endswith(
                          (".jpg", ".jpeg", ".png", ".webp")
                      ),
                      page.get("title", "")
                  )
              )

              for page in candidates:
                  title = page.get("title", "")
                  if title in used_titles:
                      continue

                  if title.lower().endswith((".pdf", ".djvu", ".svg", ".tif", ".tiff")):
                      continue

                  info_list = page.get("imageinfo", [])
                  if not info_list:
                      continue

                  info = info_list[0]
                  mime = info.get("mime", "")
                  thumbmime = info.get("thumbmime", "")
                  url = info.get("thumburl") or info.get("url", "")

                  if mime not in ("image/jpeg", "image/png", "image/webp"):
                      continue
                  if thumbmime and thumbmime not in (
                      "image/jpeg", "image/png", "image/webp"
                  ):
                      continue
                  if not url.startswith("https://"):
                      continue

                  try:
                      time.sleep(2)
                      image_response = session.get(url, timeout=90)
                      image_response.raise_for_status()

                      destination = IMAGES / f"image-{index}.jpg"
                      temporary = IMAGES / f"image-{index}.download"
                      temporary.write_bytes(image_response.content)

                      with Image.open(temporary) as im:
                          im.verify()

                      with Image.open(temporary) as im:
                          if im.format not in ("JPEG", "PNG", "WEBP"):
                              temporary.unlink(missing_ok=True)
                              continue
                          if im.width < 640 or im.height < 360:
                              temporary.unlink(missing_ok=True)
                              continue
                          converted = im.convert("RGB")
                          converted.save(destination, "JPEG", quality=92)

                      temporary.unlink(missing_ok=True)
                      used_titles.add(title)
                      attribution.append({
                          "scene": index,
                          "title": title,
                          "source": "Wikimedia Commons",
                          "url": "https://commons.wikimedia.org/wiki/"
                                 + requests.utils.quote(title.replace(" ", "_")),
                          "license_info": "Check the original Commons page for "
                                          "the individual image's license and attribution."
                      })
                      print(f"Scene {index}: {title}")
                      return destination

                  except Exception as exc:
                      print(f"Skipping unusable image {title}: {exc}")
                      (IMAGES / f"image-{index}.download").unlink(missing_ok=True)

              return None

          used_titles = set()
          attribution = []

          fallback_terms = [
              "historical photograph archive building",
              "old street historical photograph",
              "historic railway station",
              "old handwritten letter",
              "historic village photograph",
              "old industrial building",
              "historic map",
              "historic stone building",
              "old newspaper archive",
              "historical landscape photograph",
              "historic interior room",
              "historic city photograph"
          ]

          print("Finding unique scene images...")
          for index, scene in enumerate(story["scenes"], start=1):
              search_term = scene["visual_search"].strip()
              image = None

              for attempt in range(3):
                  try:
                      query = search_term if attempt == 0 else fallback_terms[index - 1]
                      image = find_image(query, index)
                      if image:
                          break
                  except Exception as exc:
                      print(f"Image search attempt failed for scene {index}: {exc}")
                      time.sleep(15 * (attempt + 1))

              if image is None:
                  raise RuntimeError(
                      f"Could not find a unique usable image for scene {index}. "
                      "Run the workflow again later."
                  )

          save_text("attribution.json", json.dumps(attribution, indent=2))

          def get_font(size):
              choices = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
              ]
              for choice in choices:
                  if Path(choice).exists():
                      return ImageFont.truetype(choice, size)
              return ImageFont.load_default()

          def wrap_words(draw, text, font, max_width):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = (current + " " + word).strip()
                  if draw.textbbox((0, 0), test, font=font)[2] <= max_width:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)
              return lines

          def make_scene_card(scene, index, start, end):
              image_path = IMAGES / f"image-{index}.jpg"
              frame_path = SCENES / f"scene-{index}.mp4"
              caption_path = SCENES / f"caption-{index}.png"

              with Image.open(image_path) as original:
                  frame = ImageOps.fit(
                      original.convert("RGB"),
                      (1920, 1080),
                      method=Image.Resampling.LANCZOS
                  )

              overlay = Image.new("RGBA", frame.size, (0, 0, 0, 0))
              draw = ImageDraw.Draw(overlay)
              draw.rectangle((0, 0, 1920, 160), fill=(0, 0, 0, 145))
              draw.rectangle((0, 880, 1920, 1080), fill=(0, 0, 0, 155))
              frame = Image.alpha_composite(
                  frame.convert("RGBA"), overlay
              ).convert("RGB")

              draw = ImageDraw.Draw(frame)
              title_font = get_font(46)
              small_font = get_font(28)

              draw.text((75, 45), "THE MIDNIGHT ARCHIVE",
                        font=title_font, fill=(255, 255, 255))
              draw.text((78, 108), f"CASE FILE  /  SCENE {index:02d}",
                        font=small_font, fill=(225, 225, 225))

              description_lines = wrap_words(
                  draw, scene["visual_description"], small_font, 1750
              )[:3]
              y = 900
              for line in description_lines:
                  draw.text((75, y), line, font=small_font,
                            fill=(255, 255, 255))
                  y += 42

              frame.save(caption_path, "PNG")

              scene_words = len(scene["narration"].split())
              total_words = sum(
                  len(s["narration"].split()) for s in story["scenes"]
              )
              scene_duration = duration * scene_words / max(total_words, 1)
              scene_duration = max(scene_duration, 1.0)

              subprocess.run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(caption_path),
                  "-t", f"{scene_duration:.3f}",
                  "-vf", "scale=1920:1080,format=yuv420p",
                  "-r", "30",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-an",
                  str(frame_path)
              ], check=True, stdout=subprocess.DEVNULL,
                 stderr=subprocess.PIPE)

              return scene_duration

          print("Building scene videos...")
          scene_durations = []
          for index, scene in enumerate(story["scenes"], start=1):
              scene_durations.append(make_scene_card(scene, index, 0, 0))

          concat_file = SCENES / "concat.txt"
          with concat_file.open("w", encoding="utf-8") as file:
              for index in range(1, 13):
                  path = (SCENES / f"scene-{index}.mp4").resolve()
                  file.write("file '" + str(path) + "'\n")

          silent_video = ROOT / "silent.mp4"
          subprocess.run([
              "ffmpeg", "-y",
              "-f", "concat", "-safe", "0",
              "-i", str(concat_file),
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "23",
              "-pix_fmt", "yuv420p",
              str(silent_video)
          ], check=True)

          final_video = ROOT / "final-video.mp4"
          subprocess.run([
              "ffmpeg", "-y",
              "-i", str(silent_video),
              "-i", str(audio_path),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video)
          ], check=True)

          print("Writing captions...")
          total_words = sum(
              len(scene["narration"].split()) for scene in story["scenes"]
          )
          seconds_per_word = duration / max(total_words, 1)
          srt_lines = []
          word_cursor = 0
          subtitle_index = 1

          def timestamp(seconds):
              milliseconds = int(round(seconds * 1000))
              hours = milliseconds // 3600000
              milliseconds %= 3600000
              minutes = milliseconds // 60000
              milliseconds %= 60000
              secs = milliseconds // 1000
              milliseconds %= 1000
              return f"{hours:02}:{minutes:02}:{secs:02},{milliseconds:03}"

          for scene in story["scenes"]:
              words = scene["narration"].split()
              for offset in range(0, len(words), 8):
                  chunk = words[offset:offset + 8]
                  start = word_cursor * seconds_per_word
                  end = min(
                      (word_cursor + len(chunk)) * seconds_per_word,
                      duration
                  )
                  srt_lines.append(str(subtitle_index))
                  srt_lines.append(
                      f"{timestamp(start)} --> {timestamp(end)}"
                  )
                  srt_lines.append(" ".join(chunk))
                  srt_lines.append("")
                  word_cursor += len(chunk)
                  subtitle_index += 1

          save_text("captions.srt", "\n".join(srt_lines))

          save_text(
              "upload-notes.txt",
              "Images are sourced from Wikimedia Commons. Check attribution.json "
              "and each original image page to confirm license and attribution "
              "requirements before publishing."
          )

          print("Uploading video to YouTube...")
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

          request_body = {
              "snippet": {
                  "title": title[:100],
                  "description": (
                      description + "\n\n"
                      "Visual credits and source notes are included in the "
                      "workflow artifact. Verify image licenses before reuse."
                  )[:5000],
                  "categoryId": "24",
                  "tags": [
                      "mystery", "history", "documentary",
                      "historical mysteries", "The Midnight Archive"
                  ],
                  "defaultLanguage": "en"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          upload = youtube.videos().insert(
              part="snippet,status",
              body=request_body,
              media_body=MediaFileUpload(
                  str(final_video),
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          result = None
          while result is None:
              status, result = upload.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress() * 100)}%")

          video_id = result.get("id", "")
          save_text("youtube-video-id.txt", video_id)
          save_text(
              "youtube-video-url.txt",
              "https://www.youtube.com/watch?v=" + video_id
          )

          print("Upload completed.")
          print("Video ID: " + video_id)
          print("The video is private until you change its visibility in YouTube Studio.")
          PYTHON

          python build.py

      - name: Save generated video and project files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-factory-output
          path: output/
          if-no-files-found: warn
          retention-days: 7
