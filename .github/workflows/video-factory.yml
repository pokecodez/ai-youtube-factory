      - name: Upload video to YouTube as private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing GitHub repository secrets: " + ", ".join(missing)
              )

          out = Path("output")
          topic = (out / "topic.txt").read_text(encoding="utf-8").strip()
          video_path = out / "signal-brief.mp4"
          attributions = json.loads(
              (out / "attribution.json").read_text(encoding="utf-8")
          )

          title = ("Signal Brief: " + topic).strip()
          if len(title) > 98:
              title = title[:95].rstrip() + "..."
          news_sources = json.loads((out / "news-sources.json").read_text(encoding="utf-8"))

          description_lines = [
              "SIGNAL BRIEF | Current news, carefully explained.",
              "",
              "A concise briefing based on recent reporting available when produced. Developing stories can change.",
              "",
              "NEWS SOURCES",
          ]
          for item in news_sources[:4]:
              description_lines.append(
                  f"- {item['source']} ({item['published'][:10]}): {item['url']}"
              )
          description_lines += [
              "",
              "IMAGE CREDITS AND LICENCES",
              "Each linked Wikimedia Commons file page identifies the image title, creator and licence terms.",
          ]
          licence_groups = {}
          generated_count = 0
          for item in attributions:
              licence_name = item.get("license") or "Licence listed on source page"
              source_url = item.get("foreign_landing_url") or ""
              if source_url:
                  licence_groups.setdefault(licence_name, []).append(source_url)
              elif licence_name == "Generated graphic":
                  generated_count += 1
          for licence_name, source_urls in sorted(licence_groups.items()):
              description_lines.append(licence_name + ": " + " ".join(source_urls))
          if generated_count:
              description_lines.append(
                  f"Generated context cards: {generated_count}; created by Signal Brief for this video."
              )
          description_lines += [
              "",
              "Narration and original background music were generated for this video. Illustrative images "
              "should not be assumed to depict the exact moment described unless their source confirms it.",
              "",
              "Channel: Signal Brief",
          ]
          description = "\n".join(description_lines)
          if len(description) > 4900:
              raise SystemExit(
                  f"Description needs {len(description)} characters, exceeding YouTube's limit after "
                  "including source and image licence credits. Reduce the number of source images rather "
                  "than silently omitting required attribution."
              )

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          youtube = build("youtube", "v3", credentials=credentials)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title,
                      "description": description,
                      "categoryId": "27",
                      "defaultLanguage": "en-GB",
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False,
                  },
              },
              media_body=MediaFileUpload(
                  str(video_path),
                  mimetype="video/mp4",
                  chunksize=8 * 1024 * 1024,
                  resumable=True,
              ),
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"YouTube upload progress: {int(status.progress() * 100)}%")

          video_id = response.get("id")
          if not video_id:
              raise SystemExit("YouTube did not return a video ID.")

          print("Upload complete. Video is PRIVATE pending your review.")
          print("YouTube Studio URL: https://studio.youtube.com/video/" + video_id + "/edit")
          (out / "youtube-upload.txt").write_text(
              "Video ID: " + video_id + "\n"
              + "Studio URL: https://studio.youtube.com/video/" + video_id + "/edit\n"
              + "Privacy: private\n",
              encoding="utf-8",
          )
          PY

