          random.seed(seed)

          root_notes = random.choice([55.0, 61.74, 65.41, 73.42, 82.41])
          chord_sets = [
              [1.0, 1.1892, 1.4983],
              [1.0, 1.1892, 1.4142],
              [1.0, 1.2599, 1.4983],
              [1.0, 1.1225, 1.3348]
          ]
          chords = [random.choice(chord_sets) for _ in range(4)]
          chord_length = max(8.0, duration / 4)
          total_samples = int(duration * sample_rate)
          pulse_rate = random.choice([0.04, 0.06, 0.08])
          output = Path("output/background-music.wav")

          with wave.open(str(output), "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)

              buffer = bytearray()

              for start in range(0, total_samples, 4096):
                  end = min(start + 4096, total_samples)

                  for n in range(start, end):
                      t = n / sample_rate
                      chord_index = min(3, int(t / chord_length))
                      chord = chords[chord_index]
                      fade_in = min(1.0, t / 2.5)
                      fade_out = min(1.0, max(0.0, (duration - t) / 3.5))
                      envelope = fade_in * fade_out

                      left = 0.0
                      right = 0.0

                      for i, ratio in enumerate(chord):
                          frequency = root_notes * ratio
                          slow_motion = 1.0 + 0.003 * math.sin(
                              2 * math.pi * (0.025 + i * 0.009) * t
                          )
                          phase = 2 * math.pi * frequency * slow_motion * t
                          tone = (
                              math.sin(phase)
                              + 0.28 * math.sin(phase * 2.003)
                          ) / 1.28
                          left += tone * (0.16 / (i + 1))
                          right += math.sin(phase + 0.12 * i) * (0.16 / (i + 1))

                      drone = (
                          math.sin(2 * math.pi * (root_notes / 2) * t) * 0.12
                          + math.sin(2 * math.pi * (root_notes / 2.01) * t) * 0.08
                      )

                      pulse = max(
                          0.0,
                          math.sin(2 * math.pi * pulse_rate * t)
                      ) ** 8 * 0.035

                      left = (left * 0.55 + drone + pulse) * envelope
                      right = (right * 0.55 + drone + pulse) * envelope

                      left = max(-0.8, min(0.8, left))
                      right = max(-0.8, min(0.8, right))

                      buffer.extend(struct.pack(
                          "<hh",
                          int(left * 32767),
                          int(right * 32767)
                      ))

                  wav.writeframesraw(buffer)
                  buffer.clear()

          print(f"Generated a new ambient music track using seed {seed}.")
          print(f"Music duration: {duration:.1f} seconds.")
          PY

      - name: Assemble MP4 with generated background music
        run: |
          set -euo pipefail

          duration=$(cat output/duration.txt)
          count=$(find output/images -maxdepth 1 -name 'image-*.jpg' | wc -l)
          music="output/background-music.wav"

          mkdir -p output/frames

          for i in $(seq 1 "$count"); do
            length=$(python -c "print($duration/$count)")

            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 -framerate 24 -i "output/images/image-$i.jpg" \
              -t "$length" \
              -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,zoompan=z='min(zoom+0.0005,1.08)':d=1:s=1920x1080:fps=24,setsar=1" \
              -an -c:v libx264 -pix_fmt yuv420p \
              "output/frames/scene-$i.mp4"
          done

          for f in output/frames/scene-*.mp4; do
            printf "file '%s'\n" "frames/$(basename "$f")"
          done > output/concat.txt

          fade_start=$(python -c "print(max(0,float('$duration')-3))")

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i output/concat.txt \
            -i output/narration.wav \
            -i "$music" \
            -filter_complex \
            "[1:a]volume=1.0[narration];[2:a]volume=0.10,afade=t=out:st=${fade_start}:d=3[music];[narration][music]amix=inputs=2:duration=first:dropout_transition=2[audio]" \
            -vf "subtitles=output/captions.srt:force_style='FontName=Arial,FontSize=22,Outline=2,Shadow=1,Alignment=2,MarginV=55'" \
            -map 0:v:0 -map "[audio]" \
            -c:v libx264 -preset ultrafast -crf 23 \
            -c:a aac -b:a 160k -shortest \
            -movflags +faststart \
            output/mystery-documentary.mp4

      - name: Upload finished video and source files
        uses: actions/upload-artifact@v4
        with:
          name: mystery-documentary-video
          path: output/
          if-no-files-found: error
          retention-days: 7
